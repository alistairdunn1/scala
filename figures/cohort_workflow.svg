<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
<title id="title">Cohort-based age composition workflow</title>
<desc id="desc">Cohort-based age composition workflow. Probability estimation, age assignment and composition scaling are separate steps. Bootstrap age draws use fixed fitted probabilities.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18364b}.heading{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700}.detail{font-size:14px}.code{font-family:Consolas,monospace;font-size:14px}.note{font-size:13px;fill:#465c6b}.arrow{fill:none;stroke:#536779;stroke-width:2;marker-end:url(#arrow)}.loop{fill:none;stroke:#187d80;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
<rect width="900" height="800" fill="white"/>
<text x="450" y="37" class="heading" text-anchor="middle">Cohort-based age composition workflow</text><rect x="40" y="85" width="360" height="70" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="220" y="112" class="label" text-anchor="middle">Aged subsample</text><text x="220" y="136" class="detail" text-anchor="middle">Age and fitted covariates</text><rect x="500" y="85" width="360" height="70" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="680" y="112" class="label" text-anchor="middle">Fish observations</text><text x="680" y="136" class="detail" text-anchor="middle">Length, year, sex and fitted covariates</text><rect x="40" y="215" width="360" height="112" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="220" y="242" class="code" text-anchor="middle">fit_cohort_alk()</text><text x="220" y="266" class="detail" text-anchor="middle">Positive-age conditional cohort model</text><text x="220" y="288" class="detail" text-anchor="middle">Optional inclusive age plus group</text><path class="arrow" d="M220 155V215"/><path class="arrow" d="M220 327V365H330V395"/><path class="arrow" d="M680 155V365H570V395"/><rect x="180" y="395" width="540" height="82" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="450" y="422" class="code" text-anchor="middle">assign_ages(fish_data, model)</text><text x="450" y="446" class="detail" text-anchor="middle">Random, modal or rounded-expected age</text><text x="450" y="468" class="detail" text-anchor="middle">Optional probabilities; fitted age support retained</text><text x="450" y="502" class="note" text-anchor="middle">assign_ages_from_cohort() delegates to assign_ages().</text><path class="arrow" d="M450 515V570"/><rect x="150" y="570" width="600" height="82" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="450" y="597" class="code" text-anchor="middle">calculate_age_compositions_from_model()</text><text x="450" y="621" class="detail" text-anchor="middle">Assigned fish + strata + catch or survey expansion</text><text x="450" y="643" class="detail" text-anchor="middle">Point composition uses the supplied ages</text><path class="arrow" d="M450 652V704"/><rect x="240" y="704" width="420" height="65" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="450" y="731" class="label" text-anchor="middle">Scaled age compositions</text><text x="450" y="755" class="detail" text-anchor="middle">Proportions and bootstrap uncertainty</text><path class="loop" d="M750 610H820V436H720"/><text x="800" y="525" class="note" text-anchor="end"><tspan x="800">Optional bootstrap:</tspan><tspan x="800" dy="18">resample fish and redraw ages</tspan></text><text x="450" y="789" class="note" text-anchor="middle">Fixed model probabilities; coefficient uncertainty requires refitting or parameter draws.</text></svg>