<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Continuation-ratio age model</title>
<desc id="desc">Continuation-ratio age model. Each observed age below the oldest is a conditional binary step; age probabilities are the product of earlier continuation probabilities and the step probability.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18364b}.heading{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700}.detail{font-size:14px}.code{font-family:Consolas,monospace;font-size:14px}.note{font-size:13px;fill:#465c6b}.arrow{fill:none;stroke:#536779;stroke-width:2;marker-end:url(#arrow)}.loop{fill:none;stroke:#187d80;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
<rect width="900" height="560" fill="white"/><text x="450" y="37" class="heading" text-anchor="middle">Continuation-ratio age model</text><text x="450" y="64" class="note" text-anchor="middle">Observed ages a&#8321; &lt; a&#8322; &lt; &#8230; &lt; a&#8342;; one conditional logit per step below the oldest age</text><rect x="30" y="95" width="180" height="82" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="120" y="120" class="label" text-anchor="middle">Step a&#8321;</text><text x="120" y="143" class="detail" text-anchor="middle">Is A = a&#8321;?</text><text x="120" y="164" class="note" text-anchor="middle">All fish</text><rect x="250" y="95" width="180" height="82" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="340" y="120" class="label" text-anchor="middle">Step a&#8322;</text><text x="340" y="143" class="detail" text-anchor="middle">Is A = a&#8322;?</text><text x="340" y="164" class="note" text-anchor="middle">Fish with A &#8805; a&#8322;</text><rect x="470" y="95" width="180" height="82" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="560" y="120" class="label" text-anchor="middle">Step a&#8323;</text><text x="560" y="143" class="detail" text-anchor="middle">Is A = a&#8323;?</text><text x="560" y="164" class="note" text-anchor="middle">Fish with A &#8805; a&#8323;</text><rect x="690" y="95" width="180" height="82" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="780" y="120" class="label" text-anchor="middle">Oldest age a&#8342;</text><text x="780" y="143" class="detail" text-anchor="middle">No further step</text><text x="780" y="164" class="note" text-anchor="middle">Remaining probability</text><path class="arrow" d="M210 136H248"/><text x="230.0" y="128" class="note" text-anchor="middle">no</text><text x="230.0" y="154" class="note" text-anchor="middle">1 &#8722; q</text><path class="arrow" d="M430 136H468"/><text x="450.0" y="128" class="note" text-anchor="middle">no</text><text x="450.0" y="154" class="note" text-anchor="middle">1 &#8722; q</text><path class="arrow" d="M650 136H688"/><text x="670.0" y="128" class="note" text-anchor="middle">no</text><text x="670.0" y="154" class="note" text-anchor="middle">1 &#8722; q</text><path class="arrow" d="M120 177V238"/><text x="128" y="212" class="note">yes: q[a]</text><rect x="25" y="238" width="190" height="52" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="120" y="270" class="detail" text-anchor="middle">P(a&#8321;) = q[a&#8321;]</text><path class="arrow" d="M340 177V238"/><text x="348" y="212" class="note">yes: q[a]</text><rect x="245" y="238" width="190" height="52" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="340" y="270" class="detail" text-anchor="middle">P(a&#8322;) = R[a&#8322;] q[a&#8322;]</text><path class="arrow" d="M560 177V238"/><text x="568" y="212" class="note">yes: q[a]</text><rect x="465" y="238" width="190" height="52" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="560" y="270" class="detail" text-anchor="middle">P(a&#8323;) = R[a&#8323;] q[a&#8323;]</text><path class="arrow" d="M780 177V238"/><rect x="685" y="238" width="190" height="52" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="780" y="270" class="detail" text-anchor="middle">P(a&#8342;) = R[a&#8342;]</text><text x="450" y="322" class="detail" text-anchor="middle">R[a] = product of (1 &#8722; q[j]) over earlier steps j &lt; a: the probability remaining at step a. Each row sums to one.</text><rect x="30" y="350" width="410" height="180" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="235" y="377" class="label" text-anchor="middle">Step logit (one per age and sex)</text><text x="235" y="404" class="code" text-anchor="middle">logit q[a] = &#946;[a,sex] + f[a,sex](length)</text><text x="235" y="426" xml:space="preserve" class="code" text-anchor="middle">+ f[a,sex](year)   or   + u[a,year,sex]</text><text x="235" y="456" class="note" text-anchor="middle">k_year: age-specific year smooths</text><text x="235" y="476" class="note" text-anchor="middle">cohort_rw: u penalised along cohorts,</text><text x="235" y="494" class="note" text-anchor="middle">u[a+1,y+1,sex] &#8722; u[a,y,sex] ~ random walk</text><text x="235" y="514" class="note" text-anchor="middle">age_pooling: smooths shared across steps</text><rect x="460" y="350" width="410" height="180" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="665" y="377" class="label" text-anchor="middle">Expanded binomial data</text><text x="665" y="404" class="detail" text-anchor="middle">A fish aged a&#8323; contributes three rows:</text><text x="665" y="428" xml:space="preserve" class="code" text-anchor="middle">step a&#8321;: 0   step a&#8322;: 0   step a&#8323;: 1</text><text x="665" y="452" class="detail" text-anchor="middle">A fish in the oldest category contributes</text><text x="665" y="472" class="detail" text-anchor="middle">a 0 at every step.</text><text x="665" y="500" class="note" text-anchor="middle">Binomial likelihood = categorical likelihood;</text><text x="665" y="518" class="note" text-anchor="middle">rows are not independent fish for resampling.</text></svg>