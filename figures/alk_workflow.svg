<svg xmlns="http://www.w3.org/2000/svg" width="900" height="820" viewBox="0 0 900 820" role="img" aria-labelledby="title desc">
<title id="title">Traditional age-length key workflows</title>
<desc id="desc">Traditional age-length key workflows. Probability estimation, age assignment and composition scaling are separate steps. Bootstrap age draws use fixed fitted probabilities.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#536779"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#18364b}.heading{font-size:24px;font-weight:700}.label{font-size:17px;font-weight:700}.detail{font-size:14px}.code{font-family:Consolas,monospace;font-size:14px}.note{font-size:13px;fill:#465c6b}.arrow{fill:none;stroke:#536779;stroke-width:2;marker-end:url(#arrow)}.loop{fill:none;stroke:#187d80;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#arrow)}</style>
<rect width="900" height="820" fill="white"/>
<text x="450" y="37" class="heading" text-anchor="middle">Traditional age-length key workflows</text><rect x="40" y="85" width="360" height="70" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="220" y="112" class="label" text-anchor="middle">Aged subsample</text><text x="220" y="136" class="detail" text-anchor="middle">Age, length and optional sex</text><rect x="500" y="85" width="360" height="70" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="680" y="112" class="label" text-anchor="middle">Fish sampling data</text><text x="680" y="136" class="detail" text-anchor="middle">Length, sex, strata and expansion data</text><rect x="40" y="215" width="360" height="80" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="220" y="242" class="code" text-anchor="middle">create_alk()</text><text x="220" y="266" class="detail" text-anchor="middle">Complete key; optional bootstrap keys</text><path class="arrow" d="M220 155V215"/><text x="220" y="350" class="label" text-anchor="middle">Probability allocation</text><text x="680" y="350" class="label" text-anchor="middle">Individual age assignment</text><rect x="40" y="390" width="360" height="80" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="220" y="417" class="code" text-anchor="middle">calculate_length_compositions()</text><text x="220" y="441" class="detail" text-anchor="middle">Scaled length compositions</text><rect x="500" y="390" width="360" height="80" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="680" y="417" class="code" text-anchor="middle">assign_ages(fish_data, key)</text><text x="680" y="441" class="detail" text-anchor="middle">Match length bins and sex</text><text x="680" y="463" class="detail" text-anchor="middle">Explicit length_bin_size when needed</text><path class="arrow" d="M680 155V180H885V370H680V390"/><path class="arrow" d="M500 120H460V370H220V390"/><path class="arrow" d="M400 255H440V365H760V390"/><rect x="20" y="550" width="400" height="95" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="220" y="577" class="code" text-anchor="middle">calculate_age_compositions()</text><text x="220" y="601" class="detail" text-anchor="middle">Apply key probabilities to length totals</text><text x="220" y="623" class="detail" text-anchor="middle">Can use bootstrap keys and length totals</text><rect x="480" y="550" width="400" height="95" rx="9" fill="#e8f4f2" stroke="#9fb5c5"/><text x="680" y="577" class="code" text-anchor="middle">calculate_age_compositions_from_model()</text><text x="680" y="601" class="detail" text-anchor="middle">Scale assigned fish</text><text x="680" y="623" class="detail" text-anchor="middle">Optional repeated draws from the supplied key</text><path class="arrow" d="M220 470V550"/><path class="arrow" d="M680 470V550"/><path class="arrow" d="M40 255H10V590H20"/><path class="arrow" d="M220 645V685H400V715"/><path class="arrow" d="M680 645V685H500V715"/><rect x="240" y="715" width="420" height="65" rx="9" fill="#edf3f9" stroke="#9fb5c5"/><text x="450" y="742" class="label" text-anchor="middle">Scaled age compositions</text><text x="450" y="766" class="detail" text-anchor="middle">Choose one allocation or assignment workflow</text><text x="450" y="805" class="note" text-anchor="middle">Fixed-key age draws do not propagate uncertainty in key proportions.</text></svg>